# test on main / PRs to main; installers only on v* tags (or manual dispatch)
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.7'
  WORKING_DIR: dicomflow_app

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dicomflow_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install ffmpeg for convert tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dicomflow_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: DicomFlow-android-apk
          path: dicomflow_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  macos:
    name: macOS app
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dicomflow_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/fetch_ffmpeg.dart
      - run: dart run tool/fetch_7zip.dart
      - run: flutter build macos --release
      - name: Zip DicomFlow.app
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent DicomFlow.app "$GITHUB_WORKSPACE/DicomFlow-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: DicomFlow-macos
          path: DicomFlow-macos.zip
          if-no-files-found: error

  windows:
    name: Windows package
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dicomflow_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/fetch_ffmpeg.dart
      - run: dart run tool/fetch_7zip.dart
      - run: flutter build windows --release
      - name: Copy ffmpeg next to exe if missing
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          $src = "windows/runner/resources/ffmpeg"
          if ((Test-Path "$src/ffmpeg.exe") -and -not (Test-Path "$rel/ffmpeg.exe")) {
            Copy-Item "$src/ffmpeg.exe" $rel
            Copy-Item "$src/ffprobe.exe" $rel -ErrorAction SilentlyContinue
          }
          $src7 = "windows/runner/resources/7zip"
          if ((Test-Path "$src7/7z.exe") -and -not (Test-Path "$rel/7z.exe")) {
            Copy-Item "$src7/7z.exe" $rel
            Copy-Item "$src7/7z.dll" $rel
          }
      - name: Zip Release folder
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "$env:GITHUB_WORKSPACE/DicomFlow-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: DicomFlow-windows
          path: DicomFlow-windows.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [android, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Name files for the release
        run: |
          mkdir -p out
          cp dist/DicomFlow-android-apk/app-release.apk "out/DicomFlow-${GITHUB_REF_NAME}-android.apk"
          cp dist/DicomFlow-macos/DicomFlow-macos.zip "out/DicomFlow-${GITHUB_REF_NAME}-macos.zip"
          cp dist/DicomFlow-windows/DicomFlow-windows.zip "out/DicomFlow-${GITHUB_REF_NAME}-windows.zip"
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          name: DicomFlow ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
          body: |
            Convert hospital DICOM archives to MP4/GIF on this device. Offline. Not for diagnosis.

            医院 DICOM 压缩包本机转成 MP4/GIF。全程离线，不作诊断依据。

            | File | Notes |
            | --- | --- |
            | `DicomFlow-${{ github.ref_name }}-android.apk` | Debug-signed; not for Play Store |
            | `DicomFlow-${{ github.ref_name }}-macos.zip` | Ad-hoc signed `.app`; not notarized |
            | `DicomFlow-${{ github.ref_name }}-windows.zip` | Portable Release folder, includes ffmpeg and 7-Zip |
